name: Field Notes

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Refresh the Field Notes block
        run: python3 scripts/update_field_notes.py

      - name: Commit if the feed moved
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh Field Notes from the mdm.tools feed"
          git push
